<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Brinson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #faf8f8;
            --ink: #2b2b2b;
            --ink-soft: #6b6b6b;
            --line: #e5e5e5;
            --accent: #284b63;
            --accent-soft: #84a59d;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #161618;
                --ink: #ebebec;
                --ink-soft: #9a9a9a;
                --line: #333136;
                --accent: #7b97aa;
                --accent-soft: #84a59d;
            }
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Meiryo, Arial, sans-serif;
        }
        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .top {
            flex-shrink: 0;
        }
        .spacer {
            flex: 1;
        }
        .name {
            text-align: right;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
            color: var(--ink-soft);
        }
        hr {
            border: none;
            border-top: 1px solid var(--line);
            margin: 0 0 1.6rem;
        }
        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            margin-top: 2rem;
        }
        nav a {
            text-decoration: none;
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 0.95rem;
        }
        nav a:hover {
            color: var(--accent);
        }
        .work {
            flex-shrink: 0;
            text-align: right;
        }
        .work a {
            text-decoration: none;
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 0.95rem;
        }
        .work a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="top">
            <div class="name">Peter Brinson</div>
            <nav>
                <a href="https://peterbrinson.github.io/teach/389">CTIN 389</a>
                <a href="https://peterbrinson.github.io/teach/534">CTIN 534</a>
                <a href="https://peterbrinson.github.io/teach/AI/">AI Knowledge Bases</a>
            </nav>
        </div>
        <div class="spacer"></div>
        <div class="work">
            <a href="work.html">My Work</a>
        </div>
    </div>
</body>
</html>
